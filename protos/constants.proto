    uint32 battery_temperature_adc_value = 9; //0-4095 //Added in FW 4.0.16
    bool not_supported_charger = 10; //Handy 2 only - If the charger is not supported by the device (ex: <15V) - Added in FW 4.0.16
    bool shut_down_voltage_detected = 11; //If the device is shutting down due to low battery voltage - Added in FW 4.0.16
    bool charger_fault_detected = 12; //Handy 2 only - If the charger is faulty (Most likely high temperature) - Added in FW 4.0.16
    float last_fully_charged_voltage = 13; //[V] when the charger cut of last time. Used as a reference for 100% battery voltage - Added in FW 4.0.19
    bool chgr = 14; // IC chgr status - only OH - Added in FW 4.0.19
    bool ic_done = 15; // IC done status - only OH - Added in FW 4.0.19
    bool pg = 16; // Power good status - only H2 - Added in FW 4.0.19
    bool charger_disabled = 17; // Only H2 (and future Oh versions) - Charger is disabled due to battery full - Added in FW 4.0.19
    bool charging = 18; // Charger is charging the battery - Added in FW 4.0.19
    bool low_voltage_detected = 19; // Low voltage detected - Added in FW 4.2 - User should charge the device as soon as possible.
}

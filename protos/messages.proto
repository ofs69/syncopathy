//856 - Read the LAST results of the FW4.4 maintenance tests (RequestTestUniformity
//582, RequestTestMaxSpeed 583). Pure read, no motion. A result whose `result`
//field is nonzero (or whose passes == 0) has not completed successfully since
//boot - results are RAM only. Show `verdict` to the user; show the bins to a
//technician / the factory (compare against a fleet template there).
//Added in FW4.4
message RequestSlideMaintResultGet{
}
enum SlideMaintVerdict{
    SLIDE_MAINT_OK = 0;
    SLIDE_MAINT_CHECK = 1; //uniformity: probably wants lubrication / inspection; max speed: a stop overran the travel window
    SLIDE_MAINT_FAIL = 2;  //uniformity: mechanical fault; max speed: a stop landed inside an end buffer
}
message SlideMaintDirResult{
    repeated float speed = 1; //12 bins along the stroke, mean speed at constant duty [mm/s]; 0 = no data in that bin
    float plateau = 2;        //mean speed over the last 25 % of travel [mm/s]
    float rise_ms = 3;        //motion start to 63 % of the pass peak speed [ms] (inertia / damping)
    float worst_dip_pct = 4;  //largest LOCAL NOTCH: a bin slower than the mean of its two neighbours, after the
                              //acceleration peak, in travel order [%]. A bind is a notch; a gradient is not
    uint32 worst_dip_bin = 5; //bin index of that notch, 0 = start of the stroke
    uint32 passes = 6;        //passes that produced data (2 expected)
    float mid = 7;            //mean speed over the middle 50 % of the stroke [mm/s] - the same bins for both directions
    float gradient_pct = 8;   //(last 25 % of travel - middle 50 %) / middle x 100: negative = slower toward the far end
                              //(an end that is tighter than the middle: dry, worn or bent there)
}
message SlideMaintUniformityResult{
    int32 result = 1;         //0 ok, else the RequestTestUniformity result code
    float duty = 2;           //open-loop duty used
    float bin_mm = 3;         //bin width [mm]
    float lo = 4;             //travel window start [mm] (inside the end buffers)
    float hi = 5;             //travel window end [mm]
    SlideMaintDirResult forward = 6;
    SlideMaintDirResult backward = 7;
    float asymmetry = 8;      //forward.mid / backward.mid over the SAME middle-of-stroke bins, 1.0 = symmetric (a one-way load moves it)
    SlideMaintVerdict verdict = 9;
    float temp_c = 10;        //motor temperature at the start of the run
    uint32 timestamp_ms = 11; //device time of the run (ms since boot)
}
message SlideMaintMaxSpeedResult{
    int32 result = 1;          //0 ok, else the RequestTestMaxSpeed result code
    float peak_forward = 2;    //[mm/s]
    float peak_backward = 3;   //[mm/s]
    float duty = 4;            //motor power used (the variant's cap, 0-1)
    float margin_forward = 5;  //travel window left after the stop [mm]; negative = overran the window
    float margin_backward = 6;
    bool buffer_hit_forward = 7;  //the stop landed inside the end buffer - too close to the mechanics
    bool buffer_hit_backward = 8;
    float brake_k = 9;         //measured braking constant: stop distance = brake_k x v^2 [mm per (mm/s)^2]
    float brake_cal_speed = 10; //the speed it was measured at [mm/s]
    float brake_cal_dist = 11;  //and the stop distance it took [mm]
    uint32 passes = 12;
    SlideMaintVerdict verdict = 13;
    float temp_c = 14;
    uint32 timestamp_ms = 15;
}
message ResponseSlideMaintResultGet{
    SlideMaintUniformityResult uniformity = 1;
    SlideMaintMaxSpeedResult max_speed = 2;
    bool running = 3; //a maintenance test is in progress right now
}

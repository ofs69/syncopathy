//853 - Live regulator snapshot: the most recent control tick's state,
//available WITHOUT arming any diag capture (a 1-record capture cannot be
//polled live - reads require a frozen capture). valid=false until the
//regulator has driven since boot; time_us tells how fresh the tick is.
//Field meanings match the regulator capture record (see the capture docs).
//Added in FW4.4
message RequestSlideSnapshotGet{
}
message ResponseSlideSnapshotGet{
    bool valid = 1;
    uint64 time_us = 2;
    float position = 3; //[mm]
    float speed = 4; //[mm/s]
    float target_speed = 5; //[mm/s]
    float trim = 6; //bounded integral trim, output units (RENAMED from integral in FW4.4 pre-release; same number)
    float output = 7; //output units
    float motor = 8; //[0-1] duty
    uint32 phase = 9; //0 run 1 turn_brake 2 turn_reverse_brake 3 turn_fade 4 turn_done 5 overspeed_stop 6 turn_backlash
    uint32 dir = 10;
    uint32 target_dir = 11;
    float target_pos = 12; //[mm] NAN until the first position command
    uint32 current_time_ms = 13; //script playback clock; 0 = no live script
    float expected_pos = 14; //[mm] intended trajectory; NAN until the first position command
    //Controller decomposition (FW4.4): on a run record ff + p_term + d_term + kick + trim = the
    //output BEFORE the clamps (min/max, soft start, slew, overspeed brake), so output minus that
    //sum is what the clamps took this tick. All 0 on turn-phase records.
    float ff = 15; //feedforward line for the target, per direction
    float p_term = 16; //effective speed error x kp (0 inside the deadband)
    float d_term = 17; //filtered derivative x kd, after its clamp
    float kick = 18; //decaying target kick
    uint32 dt_us = 19; //actual tick period [us] - ticks run on Hall edges or the 30 ms timeout
    //Per-tick state bits: 1 deadband (P/I/D saw 0), 2 trim frozen at max (anti-windup), 4 trim frozen
    //at min, 8 soft-start capped the output, 16 slew limiter capped the output, 32 overspeed brake
    //active (pulled trim AND output), 64 speed from the estimator (timeout tick, no fresh Hall edge),
    //128 ff+P+D+kick+trim hit the xMin/xMaxSpeedTheoretical clamp.
    uint32 flags = 20;
}

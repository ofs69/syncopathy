message RequestHspJitterFilterSet{
    bool jitter_filter = 1; //[Default FALSE] Swallow consecutive slow points targeting within threshold_mm of
                            //the current position. Enable for LIVE streamed input (hand jitter would
                            //otherwise buzz the slide); leave off for scripted playback - every authored
                            //point is dispatched. Swallowed points appear in the HSP diag capture as
                            //'filtered' events (event 9). Reset to OFF by RequestHspSetup (860).
                            //Before FW4.4 the filter was always ON.
    float threshold_mm = 2; //[Default 0 = firmware default, currently 1.0 mm] the 'close enough
                            //to swallow' gate, in mm of actual-position error. Two gates must BOTH
                            //pass for a point to be swallowed: slow (implied speed below the
                            //device's min speed, ~15 mm/s) AND close (below this threshold). The
                            //speed gate caps the threshold's reach at minSpeed x point-spacing
                            //(0.9 mm at 60 ms cadence, 1.5 mm at 10 Hz) - a larger threshold has
                            //no further effect. Wire x resolution is 1% of stroke (~1.25 mm): at
                            //the 1 mm default only EXACT-repeat points are swallowed; ~2 mm also
                            //swallows +-1-unit flicker on streams at <=10 Hz (bounded lag: a slow
                            //genuine drift dispatches once its accumulated error exceeds the gate).
}
message ResponseHspJitterFilterSet{
    HspState state = 1; //state.jitter_filter/jitter_filter_threshold_mm reflect the values now in effect
}
//874 - Added in FW4.4
message RequestHspScriptSpeedSet{
    bool script_speed = 1; //[Default FALSE] Command each point at the speed the stream itself implies
                           //(previous point -> next point over the remaining time) instead of
                           //re-deriving it from the slide's measured position every point. The
                           //position-based default feeds tracking error back into the next command:
                           //a stroke that reaches its reversal a few mm short is followed by a SLOWER
                           //stroke, which arrives short again (stroke shortening on reversing
                           //content). With script_speed the authored speed profile is kept and the
                           //slide arrives a few ms late instead. The slow start after play/resume,
                           //the post-resync speed cap and the late-point cap still apply. The
                           //jitter filter (873) is independent and may be combined. Reset to OFF by
                           //RequestHspSetup (860).
}
message ResponseHspScriptSpeedSet{
    HspState state = 1; //state.script_speed reflects the value now in effect
}
